<div class="pagination" style="display:flex;justify-content:center;margin-top:24px;">
    <span class="step-links" style="display:flex;align-items:center;gap:12px;">

        {% if page.has_previous %}
            <a href="?page={{ page.previous_page_number }}" style="display:inline-block;padding:10px 14px;background:#ffffff;border-radius:8px;color:#111;font-weight:700;text-decoration:none;box-shadow:0 6px 14px rgba(0,0,0,0.08);">
                Previous
            </a>
        {% endif %}

        <span class="current" style="display:inline-flex;align-items:center;padding:10px 14px;color:#111;background:#f3f4f6;border-radius:8px;font-weight:700;">
            Page <span class="page-number" style="margin:0 8px;color:#111;font-weight:900;font-size:1.05rem;">{{ page.number }}</span> of <span class="page-number" style="margin:0 8px;color:#111;font-weight:900;font-size:1.05rem;">{{ page.paginator.num_pages }}</span>.
        </span>

        {% if page.has_next %}
            <a href="?page={{ page.next_page_number }}" style="display:inline-block;padding:10px 14px;background:#ffffff;border-radius:8px;color:#111;font-weight:700;text-decoration:none;box-shadow:0 6px 14px rgba(0,0,0,0.08);">
                Next
            </a>
        {% endif %}

    </span>
</div>
