{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Blog{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/blog.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="p-3 bg-dark text-white">
        <div class="row align-items-center">
            <div class="col">
               <a class="text-decoration-none text-light" href="{% url 'blog:post_list' %}"><h3>Blog</h3></a>
            </div>
            <div class="col text-center">
                <div class="d-flex justify-content-center gap-3">
                    <a class="text-light text-decoration-none" href="{% url 'blog:post_list' %}">Home</a>
                    <a class="text-light text-decoration-none" href="#">About</a>
                    <a class="text-light text-decoration-none" href="#">Contact</a>
                </div>
            </div>
        </div>
    </header>

    <div class="container-fluid py-4">
        {% block content %}
        {% endblock %}
    </div>

    <footer class="bg-dark text-light p-3 mt-auto">
        <div class="container d-flex justify-content-center align-items-center">
          <span class="text-light">© 2021 Company, Inc</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
